[functions.image-upload]
verify_jwt = true

# New local-only preparations. Public endpoint sends SMS only after registry,
# provider-readiness and rate-limit checks; it never issues a session itself.
[functions.owner-phone-auth]
verify_jwt = false

[functions.admin-owner-accounts]
verify_jwt = true
