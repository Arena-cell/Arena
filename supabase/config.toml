[functions.thawani-webhook]
verify_jwt = false

[functions.payment-reconcile]
verify_jwt = false

# Shared-secret server jobs; handlers fail closed when their secret is missing.
[functions.arena-scheduler]
verify_jwt = false

[functions.push-notifications]
